[project]
name = "agrotwin-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.2",
  "scikit-learn==1.5.1",
  "joblib==1.4.2",
  "threadpoolctl==3.5.0",
  "scipy==1.13.1",
  "requests==2.32.3",
  "pydantic==2.14.3",
  "fastapi==0.162.7",
  "uvicorn==0.54.0",
  "starlette==1.10.0",
  "anyio==4.2.0",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "main:app"

[tool.vercel.scripts]
build = "python scripts/build_host.py"

[tool.vercel.fastapi.static]
cdn = true
exclude = true
